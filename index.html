<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailer do Moraes – Betim</title>
  <meta name="description" content="Hambúrgueres artesanais em Betim. Peça pelo WhatsApp!">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <img src="img/logo.png" alt="Logo Trailer do Moraes" class="logo">
    <h1>Trailer do Moraes</h1>
    <p>Os melhores hambúrgueres de Betim 🍔</p>
    <a href="#cardapio" class="btn">Ver cardápio</a>
  </header>

  <main>
    <section id="cardapio">
      <h2>Cardápio</h2>
      <div id="lista-produtos">Carregando...</div>
    </section>

    <section id="carrinho">
      <h2>Seu pedido</h2>
      <ul id="itens-carrinho"></ul>
      <p>Total: <strong id="total">R$ 0,00</strong></p>
      <input id="nome" placeholder="Seu nome">
      <input id="endereco" placeholder="Endereço (ou escreva 'Retirada no trailer')">
      <textarea id="obs" placeholder="Observações (sem cebola, ponto da carne...)"></textarea>
      <button id="finalizar" class="btn">Enviar pedido pelo WhatsApp</button>
    </section>

    <section id="contato">
      <h2>Onde estamos</h2>
      <p>📍 COLOQUE O ENDEREÇO DO TRAILER, Betim – MG</p>
      <p>🕕 Ter a Dom, das 18h às 23h</p>
      <p>📸 Instagram: @seuinstagram</p>
      <iframe src="COLE_AQUI_O_LINK_DE_INCORPORAR_DO_GOOGLE_MAPS"
              width="100%" height="300" loading="lazy" style="border:0"></iframe>
    </section>
  </main>

  <footer>© Trailer do Moraes – Betim</footer>
  <script src="app.js"></script>
</body>
</html>
